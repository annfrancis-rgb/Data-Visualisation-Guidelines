      }).join('') + '</div>';
  };
  Panel.prototype.draw = function () {
    var self = this, a = this.a, html = this.toolbar();
    if (this.view === 'code') html += '<pre class="pv-code"><code>' + esc(a.code) + '</code></pre>';
    else html += '<p class="pv-range">' + esc(a.range) + '</p><div class="pv-grid">' + a.charts.map(function (c) { return cardHTML(self, c, self.stateOf(c)); }).join('') + '</div>' + this.tables();
    this.body.innerHTML = html; this.body.scrollTop = 0; mount(this.body);
  };
  Panel.prototype.replace = function (c) {
    var old = $('#card-' + this.key + '-' + c.id, this.body); if (!old) return;
    var tmp = document.createElement('div'); tmp.innerHTML = cardHTML(this, c, this.stateOf(c));
    old.replaceWith(tmp.firstChild); mount(this.body);
  };
  Panel.prototype.run = function () {
    var self = this, token = {}; this.token = token;
    this.a.charts.forEach(function (c) { self.states[c.id] = 'loading'; });
    this.view = 'preview'; this.draw();
    this.a.charts.forEach(function (c, i) {
      setTimeout(function () {
        if (self.token !== token) return;
        self.states[c.id] = c.failFirst ? 'error' : 'ready';
        if (self.view === 'preview') self.replace(c);
      }, 900 + i * 700);
    });
  };
  Panel.prototype.chart = function (id) { return this.a.charts.filter(function (c) { return c.id === id; })[0]; };
  Panel.prototype.setWide = function (on) {
    this.frame.classList.toggle('is-wide', on);
    var b = $('[data-act="wide"]', this.el);
    b.setAttribute('aria-label', on ? 'Restore panel width' : 'Widen panel'); b.title = b.getAttribute('aria-label');
    b.innerHTML = on ? SHRINK : ico('expand');
    if (on) this.frame.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
  };

  // ── toast ──────────────────────────────────────────────────
  var toastEl = $('#pv-toast'), toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { toastEl.hidden = true; }, 2600); }

  // ── menus ──────────────────────────────────────────────────
  function closeMenus(except) {
    $$('.pv-drop .pv-menu').forEach(function (m) { if (m !== except) { m.hidden = true; m.previousElementSibling.setAttribute('aria-expanded', 'false'); } });
    $$('.pv-more .pv-menu').forEach(function (m) { if (m !== except) { m.previousElementSibling.setAttribute('aria-expanded', 'false'); m.remove(); } });
  }
  document.addEventListener('keydown', function (e) {
    var menu = document.activeElement && document.activeElement.closest && document.activeElement.closest('.pv-menu');
    if (menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      var items = $$('[role="menuitem"]', menu), i = items.indexOf(document.activeElement);
      items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); e.preventDefault();
    }
    if (e.key === 'Escape') {
      if (!$('#pv-modal').hidden) { closeModal(); return; }
      if (menu) { var b = menu.previousElementSibling; closeMenus(); if (b) b.focus(); }
    }
  });

  // ── expand dialog ──────────────────────────────────────────
  var modal = $('#pv-modal'), lastFocus = null;
  function openModal(c) {
    lastFocus = document.activeElement;
    $('#pv-mt').textContent = c.name; $('#pv-ms').textContent = c.scope;
    $('#pv-mplot').innerHTML = '<div class="dv-plot" data-chart="' + c.id + '" data-tall aria-label="' + esc(c.name) + '"></div>';
    modal.hidden = false; mount(modal); $('#pv-mclose').focus();
  }
  function closeModal() { modal.hidden = true; $('#pv-mplot').innerHTML = ''; hide(); if (lastFocus) lastFocus.focus(); }
  $('#pv-mclose').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

  function copyText(text, card) {
    var note = card && $('.dv-copied', card);
    function done(m) { if (note) { note.textContent = m; setTimeout(function () { note.textContent = ''; }, 2000); } else toast(m); }
    try { navigator.clipboard.writeText(text).then(function () { done('Copied as a table'); }, function () { done('Copy isn’t available here. Select the table instead.'); }); }
    catch (err) { done('Copy isn’t available here. Select the table instead.'); }
  }
  function tsv(table) { return Array.prototype.map.call(table.rows, function (r) { return Array.prototype.map.call(r.cells, function (c) { return c.textContent.trim(); }).join('\t'); }).join('\n'); }
  var NOTDL = 'Downloads aren’t connected in this prototype.';
  function cardAct(p, act, card, btn) {
    var c = p.chart(card.getAttribute('data-id'));
    if (act === 'table') {
      var plot = $('.dv-plot', card), t = $('.dv-table', card), on = t.hidden;
      t.hidden = !on; plot.hidden = on;
      var b = $('[data-act="table"]', card);
      b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-label', on ? 'View as chart' : 'View as table'); b.title = b.getAttribute('aria-label');
      b.innerHTML = ico(on ? 'chart' : 'table');
      card.classList.toggle('is-table', on);
      if (!on) { plot._m.force = true; render(plot._m); }
    } else if (act === 'copy') copyText(tsv($('.dv-table table', card)), card);
    else if (act === 'download') toast(NOTDL);
    else if (act === 'expand') openModal(c);
    else if (act === 'retry') {
      p.states[c.id] = 'loading'; p.replace(c);
      setTimeout(function () { p.states[c.id] = 'ready'; if (p.view === 'preview') p.replace(c); }, 900);
    } else if (act === 'more') {
      var wrap = btn.parentNode;
      if ($('.pv-menu', wrap)) { closeMenus(); return; }
      closeMenus();
      var m = document.createElement('div'); m.className = 'pv-menu pv-menu-r'; m.setAttribute('role', 'menu');
      var isT = card.classList.contains('is-table');
      m.innerHTML = [['table', isT ? 'View as chart' : 'View as table'], ['copy', 'Copy data'], ['download', 'Download CSV'], ['expand', 'Expand']].map(function (x) { return '<button type="button" role="menuitem" data-mact="' + x[0] + '">' + ico(x[0] === 'table' && isT ? 'chart' : x[0]) + x[1] + '</button>'; }).join('');
      wrap.appendChild(m); btn.setAttribute('aria-expanded', 'true'); $('[role="menuitem"]', m).focus();
    }
  }

  // ── events ─────────────────────────────────────────────────
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest('.pv-drop') && !t.closest('.pv-more')) closeMenus();
    var fr = t.closest('.pv-frame'); if (!fr) return;
    var p = P[fr.getAttribute('data-art')];
    var vb = t.closest('[data-view]'); if (vb) { p.view = vb.getAttribute('data-view'); p.draw(); return; }
    var ji = t.closest('[data-jump]');
    if (ji) {
      closeMenus();
      var card = $('#card-' + p.key + '-' + ji.getAttribute('data-jump'), p.body);
      var top = card.getBoundingClientRect().top - p.body.getBoundingClientRect().top + p.body.scrollTop - $('.pv-tools', p.body).offsetHeight - 12;
      p.body.scrollTo({ top: top, behavior: reduce ? 'auto' : 'smooth' });
      card.focus({ preventScroll: true }); card.classList.add('is-target'); setTimeout(function () { card.classList.remove('is-target'); }, 1600);
      return;
    }
    var mi = t.closest('[data-mact]'); if (mi) { var cd = mi.closest('.pv-card'), mb = $('[data-act="more"]', cd); closeMenus(); cardAct(p, mi.getAttribute('data-mact'), cd); if (mb) mb.focus(); return; }
    var tab = t.closest('.pv-tab'); if (tab) { selTab(tab); return; }
    var ab = t.closest('[data-act]'); if (!ab) return;
    var act = ab.getAttribute('data-act');
    if (act === 'wide') { p.setWide(!fr.classList.contains('is-wide')); return; }
    if (act === 'close') { toast('In aiRA this closes the panel and goes back to the chat.'); return; }
    if (act === 'jump') { var menu = ab.nextElementSibling, open = menu.hidden; closeMenus(menu); menu.hidden = !open; ab.setAttribute('aria-expanded', String(open)); if (open) $('[role="menuitem"]', menu).focus(); return; }
    if (act === 'download-all') { toast(NOTDL); return; }
    if (act === 'copy-table') { copyText(tsv($('table', ab.closest('.pv-tpanel')))); return; }
    if (ab.closest('.pv-tpanel')) { toast(NOTDL); return; }
    cardAct(p, act, ab.closest('.pv-card'), ab);
  });
  function selTab(tab) {
    var tabs = $$('.pv-tab', tab.parentNode);
    tabs.forEach(function (x) { var on = x === tab; x.setAttribute('aria-selected', String(on)); x.tabIndex = on ? 0 : -1; $('#' + x.getAttribute('aria-controls')).hidden = !on; });
    tab.focus();
  }
  document.addEventListener('keydown', function (e) {
    var tab = e.target.closest && e.target.closest('.pv-tab'); if (!tab) return;
    var tabs = $$('.pv-tab', tab.parentNode), i = tabs.indexOf(tab);
    if (e.key === 'ArrowRight') selTab(tabs[(i + 1) % tabs.length]);
    if (e.key === 'ArrowLeft') selTab(tabs[(i - 1 + tabs.length) % tabs.length]);
  });

  $$('.pv-frame').forEach(function (f) { new Panel(f); });

  $$('.pv-frame').forEach(function (f) { new Panel(f); });
  return P;
  })();

  // ── platform + example switch ──────────────────────────────
  var plat = 'web', scr = 'a1', LET = { a1: 'a', a2: 'b', a3: 'c', a4: 'd' };
  function showSel(replay) {
    $$('[data-plat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-plat') === plat)); });
    $$('[data-sw]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-sw') === scr)); });
    $$('.pv-frame').forEach(function (f) { f.hidden = !(plat === 'web' && f.getAttribute('data-art') === scr); });
    $$('.m-frame').forEach(function (f) { f.hidden = !(plat === 'mobile' && f.getAttribute('data-art') === scr); });
    $('[data-replay]').hidden = scr !== 'a4';
    hide();
    if (scr === 'a4' && replay !== false) PW.a4.run(); else mounted.forEach(render);
    try { history.replaceState(null, '', '#' + plat + '-' + LET[scr]); } catch (err) {}
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    var pb = t.closest && t.closest('[data-plat]'); if (pb) { plat = pb.getAttribute('data-plat'); showSel(); return; }
    var sb = t.closest && t.closest('[data-sw]'); if (sb) { scr = sb.getAttribute('data-sw'); showSel(); return; }
    if (t.closest && t.closest('[data-replay]')) PW.a4.run();
  });
  var h = (location.hash || '').slice(1).split('-');
  if (h.length === 2 && (h[0] === 'web' || h[0] === 'mobile')) {
    plat = h[0];
    Object.keys(LET).forEach(function (k) { if (LET[k] === h[1]) scr = k; });
    showSel();
  }
})();

</script>
