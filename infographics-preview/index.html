/* ───────────────────────── GLOBAL BASE ─────────────────────────
   Foundational rules relocated from the original tokens <style> layer.
   These are not design tokens, so they live here rather than in the
   generated variables.css. (The base `color-scheme: light dark` is
   emitted first in variables.css to preserve the original cascade.)
   ──────────────────────────────────────────────────────────────── */

/* Brand surfaces opt out of Windows High Contrast overrides so the
   indigo / sparkle gradient identity is preserved. */
@media (forced-colors: active) {
  .btn.primary,
  .btn--primary,
  .brand .mark,
  .brand .mark svg,
  .avatar,
  .pill,
  .citation {
    forced-color-adjust: none;
  }
}

/* Focus ring */
:where(button, a, input, textarea, select, [role="button"], [tabindex]):focus-visible {
  outline: 2px solid var(--aira-border-focus);
  outline-offset: 2px;
  border-radius: var(--aira-radius-xs);
}

html { scroll-padding-top: var(--aira-scroll-offset); }

/* RTL — anchor English content to its first-strong character
   (unicode-bidi: plaintext) so trailing punctuation doesn't drift. */
[dir="rtl"] p,
[dir="rtl"] li,
[dir="rtl"] td,
[dir="rtl"] th,
[dir="rtl"] h1,
[dir="rtl"] h2,
[dir="rtl"] h3,
[dir="rtl"] h4,
[dir="rtl"] .lede,
[dir="rtl"] .t1,
[dir="rtl"] .t2,
[dir="rtl"] .label,
[dir="rtl"] .helper,
[dir="rtl"] .body,
[dir="rtl"] .step,
[dir="rtl"] .detail { unicode-bidi: plaintext; }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    animation-duration: var(--aira-motion-reduced) !important;
    animation-iteration-count: 1 !important;
    transition: none !important;
    transition-duration: var(--aira-motion-reduced) !important;
    scroll-behavior: auto !important;
  }
}

/* Forced colors — component-level mappings */
@media (forced-colors: active) {
  :where(button, a, input, textarea, select, [role="button"], [tabindex]):focus-visible {
    outline: 3px solid CanvasText;
    outline-offset: 2px;
  }
  .btn, .btn--primary, .btn--secondary, .btn--tertiary, .btn--danger {
    forced-color-adjust: none;
    border: 1px solid ButtonText;
    background: ButtonFace;
    color: ButtonText;
  }
  .btn--primary { background: Highlight; color: HighlightText; }
  .btn--danger  { background: Mark;       color: MarkText; }
  .chip::before {
    forced-color-adjust: none;
    background-color: CanvasText;
  }
  .chip.success::before, .chip.brand::before { background-color: Highlight; }
  .chip.danger::before,  .chip.warning::before { background-color: Mark; }
  .nudge { border-inline-start-color: CanvasText; }
  .nudge.bug { border-inline-start-color: Mark; }
  .composer .send {
    forced-color-adjust: none;
    background: Highlight;
    color: HighlightText;
  }
}

/* ───────────────────────── BASE ───────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: var(--aira-t-body-md);
  color: var(--aira-text-primary);
  background: var(--aira-bg-canvas);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
img { max-width: 100%; display: block; }
a { color: var(--aira-text-link); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font: var(--aira-t-code); background: var(--aira-code-bg-inline); padding: 2px 6px; border-radius: var(--aira-radius-xs); color: var(--aira-text-primary); }
pre { font: var(--aira-t-code); margin: 0; }

/* ───────────────────────── LAYOUT ───────────────────────── */
.top {
  position: sticky; top: 0; z-index: 50;
  height: var(--aira-topbar-h);
  display: flex; align-items: center; gap: var(--aira-sp-4);
  padding: 0 var(--aira-sp-5);
  background: var(--aira-bg-surface);
  border-bottom: 1px solid var(--aira-border-default);
}
.brand {
  display: flex; align-items: center; gap: var(--aira-sp-2);
  font: var(--aira-t-label-lg); color: var(--aira-text-primary);
}
.brand:hover { text-decoration: none; }
.brand .mark { width: 28px; height: 28px; display: inline-grid; place-items: center; }
.brand .mark img { width: 28px; height: 28px; }
.ver { font: var(--aira-t-label-sm); color: var(--aira-text-tertiary); margin-inline-start: var(--aira-sp-2); }
.ver.v3 { color: var(--aira-text-accent); background: var(--aira-ai-accent-surface); padding: 2px 8px; border-radius: var(--aira-radius-pill); }
.spacer { flex: 1; }
.controls { display: flex; gap: var(--aira-sp-1); }
.controls button {
  font: var(--aira-t-label-sm); color: var(--aira-text-secondary);
  background: transparent; border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-sm); padding: 6px 10px; cursor: pointer;
  transition: background var(--aira-motion-fast);
}
.controls button:hover { background: var(--aira-bg-hover); }
.controls button.active { background: var(--aira-bg-brand-subtle); color: var(--aira-text-link); border-color: var(--aira-border-focus); }

.layout { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 0; }
.side {
  position: sticky; top: var(--aira-topbar-h);
  height: calc(100vh - var(--aira-topbar-h));
  overflow-y: auto;
  border-inline-end: 1px solid var(--aira-border-default);
  background: var(--aira-bg-surface);
  padding: var(--aira-sp-4);
}
.side .search-wrap {
  position: sticky; top: 0;
  z-index: 5;
  background: var(--aira-bg-surface);
  padding-bottom: var(--aira-sp-3);
  margin: 0 -2px var(--aira-sp-2);
  padding-inline: 2px;
}
.side .search-wrap::after {
  content: "";
  position: absolute; inset-inline: 0; bottom: -8px;
  height: 8px;
  background: linear-gradient(to bottom, var(--aira-bg-surface), transparent);
  pointer-events: none;
}
.side .search {
  width: 100%; font: var(--aira-t-body-sm); padding: 8px 10px;
  border: 1px solid var(--aira-border-default); border-radius: var(--aira-radius-sm);
  background: var(--aira-bg-surface);
  color: var(--aira-text-primary);
  margin: 0;
}

/* View toggle: divider between control groups */
.controls .ctrl-sep {
  display: inline-block;
  width: 1px; height: 18px;
  background: var(--aira-border-default);
  margin: 0 var(--aira-sp-1);
  align-self: center;
}

/* View toggle button icon */
.controls button svg { display: inline-block; vertical-align: -2px; margin-inline-end: 4px; }

/* ── Designer view filter ──────────────────────────────────────────
   When the user selects "Designer", hide every code-related surface.
   Toggling back to Developer reveals everything (canonical default). */
[data-view="designer"] #code-block,
[data-view="designer"] #code-tokens,
[data-view="designer"] #conventions,
[data-view="designer"] #deferred,
[data-view="designer"] #figma { display: none !important; }

[data-view="designer"] .section code,
[data-view="designer"] .section pre,
[data-view="designer"] .section .props { display: none !important; }

[data-view="designer"] .group a[href="#code-block"],
[data-view="designer"] .group a[href="#code-tokens"],
[data-view="designer"] .group a[href="#conventions"],
[data-view="designer"] .group a[href="#deferred"],
[data-view="designer"] .group a[href="#figma"] { display: none !important; }

/* Keep data-viz tables visible even in designer mode — they're design-relevant */
[data-view="designer"] #data-viz .props { display: table !important; }
[data-view="designer"] #data-viz .props code { display: inline !important; }
/* Keep the DRI table visible in designer mode — not a dev-only spec table */
[data-view="designer"] #dri .props { display: table !important; }
.side .search::placeholder { color: var(--aira-text-placeholder); }
.side .empty-search {
  display: none;
  font: var(--aira-t-caption); color: var(--aira-text-tertiary);
  padding: var(--aira-sp-2);
}
.side.searching .group { display: none; }
.side.searching .group:has(a:not(.is-hidden)) { display: block; }
.side a.is-hidden { display: none; }
.side.searching .empty-search { display: block; }
.group { margin-bottom: var(--aira-sp-5); }
.group h6 {
  font: var(--aira-t-overline); letter-spacing: var(--aira-t-overline-tracking);
  text-transform: uppercase; color: var(--aira-text-tertiary);
  margin: 0 0 var(--aira-sp-2);
}
.group a {
  display: flex; align-items: center; gap: var(--aira-sp-2);
  padding: 6px 8px; border-radius: var(--aira-radius-sm);
  font: var(--aira-t-body-sm); color: var(--aira-text-secondary);
  transition: background var(--aira-motion-fast), color var(--aira-motion-fast);
}
.group a:hover { background: var(--aira-bg-hover); color: var(--aira-text-primary); text-decoration: none; }
.group a.new::after {
  content: "NEW";
  margin-inline-start: auto;
  font: var(--aira-t-overline); letter-spacing: var(--aira-t-overline-tracking);
  background: var(--aira-ai-accent-surface); color: var(--aira-ai-accent);
  padding: 1px 6px; border-radius: var(--aira-radius-pill);
}

.main { padding: var(--aira-sp-8) var(--aira-sp-10); max-width: 1100px; }
.section {
  padding-block: var(--aira-sp-10);
  border-bottom: 1px solid var(--aira-border-subtle);
}
.section:last-child { border-bottom: 0; }
.section h1 { font: var(--aira-t-h1); letter-spacing: var(--aira-t-h1-tracking); margin: 0 0 var(--aira-sp-3); }
.section h2 { font: var(--aira-t-h3); margin: var(--aira-sp-6) 0 var(--aira-sp-3); }
.section h3 { font: var(--aira-t-h4); margin: var(--aira-sp-4) 0 var(--aira-sp-2); }
.section p  { margin: 0 0 var(--aira-sp-3); color: var(--aira-text-secondary); }
.section .lede { font: var(--aira-t-body-lg); color: var(--aira-text-secondary); margin-bottom: var(--aira-sp-5); max-width: 760px; }
.section ul { margin: 0 0 var(--aira-sp-3); padding-inline-start: var(--aira-sp-5); }
.section ul li { margin-bottom: var(--aira-sp-2); color: var(--aira-text-secondary); }
.callout {
  padding: var(--aira-sp-4); background: var(--aira-ai-accent-surface);
  border: 1px solid var(--aira-ai-accent-border);
  border-radius: var(--aira-radius-md);
  font: var(--aira-t-body-md); color: var(--aira-text-primary);
  margin-bottom: var(--aira-sp-4);
}


/* components.css */
/* ═══════════════════════════════════════════════════════════════
   Aira Design System — components.css
   Demo-card scaffolding + every atom / molecule / organism / template.
   ═══════════════════════════════════════════════════════════════ */

/* ───────────────────────── DEMO CARDS ───────────────────────── */
.card-demo {
  padding: var(--aira-sp-6);
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-lg);
  margin-bottom: var(--aira-sp-4);
}
.row { display: flex; gap: var(--aira-sp-3); align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: var(--aira-sp-3); }
.panel { padding: var(--aira-sp-5); background: var(--aira-bg-surface); border: 1px solid var(--aira-border-default); border-radius: var(--aira-radius-md); margin-bottom: var(--aira-sp-4); }
.panel-stack { display: flex; flex-direction: column; gap: var(--aira-sp-4); }
.props { width: 100%; border-collapse: collapse; margin-bottom: var(--aira-sp-4); }
.props th, .props td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--aira-border-subtle); font: var(--aira-t-body-sm); vertical-align: top; }
.props th { font: var(--aira-t-label-sm); color: var(--aira-text-secondary); background: var(--aira-bg-surface-alt); }
.do-dont { display: grid; grid-template-columns: 1fr 1fr; gap: var(--aira-sp-3); margin-bottom: var(--aira-sp-4); }
.card-vd { padding: var(--aira-sp-4); background: var(--aira-bg-surface); border: 1px solid var(--aira-border-default); border-radius: var(--aira-radius-md); }
.card-vd .lab { font: var(--aira-t-label-sm); margin-bottom: var(--aira-sp-2); }
.card-vd.do .lab { color: var(--aira-status-success-text); }
.card-vd.dont .lab { color: var(--aira-status-danger-text); }
.card-vd p { margin: 0; font: var(--aira-t-body-sm); color: var(--aira-text-secondary); }

/* ───────────────────────── SWATCHES ───────────────────────── */
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--aira-sp-2); }
.swatch { padding: 16px 12px 12px; border-radius: var(--aira-radius-md); font: var(--aira-t-label-sm); display: flex; flex-direction: column; gap: 2px; min-height: 86px; border: 1px solid var(--aira-border-subtle); }
.swatch .name { font: var(--aira-t-label-sm); }
.swatch .hex  { font: var(--aira-t-caption); opacity: 0.78; }

/* ───────────────────────── BUTTONS ───────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--aira-sp-2);
  height: 36px; padding: 0 var(--aira-sp-4);
  font: var(--aira-t-label-md);
  border-radius: var(--aira-radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background var(--aira-motion-fast), border-color var(--aira-motion-fast);
  white-space: nowrap;
}
.btn.sm { height: 28px; padding: 0 var(--aira-sp-3); font: var(--aira-t-label-sm); }
.btn.lg { height: 44px; padding: 0 var(--aira-sp-5); font: var(--aira-t-label-lg); }
.btn--primary, .btn.primary { background: var(--aira-btn-primary-bg); color: var(--aira-btn-primary-text); }
.btn--primary:hover, .btn.primary:hover { background: var(--aira-btn-primary-bg-hover); }
.btn--primary:active, .btn.primary:active { background: var(--aira-btn-primary-bg-press); }
.btn--secondary, .btn.secondary { background: var(--aira-btn-secondary-bg); color: var(--aira-btn-secondary-text); border-color: var(--aira-btn-secondary-border); }
.btn--secondary:hover, .btn.secondary:hover { background: var(--aira-btn-secondary-bg-hover); }
.btn--secondary:active, .btn.secondary:active { background: var(--aira-btn-secondary-bg-press); }
.btn--tertiary, .btn.tertiary { background: var(--aira-btn-tertiary-bg); color: var(--aira-btn-tertiary-text); border-color: transparent; }
.btn--tertiary:hover, .btn.tertiary:hover { background: var(--aira-btn-tertiary-bg-hover); }
.btn--tertiary:active, .btn.tertiary:active { background: var(--aira-btn-tertiary-bg-press); }
.btn--danger, .btn.danger { background: var(--aira-btn-danger-bg); color: var(--aira-btn-danger-text); }
.btn--danger:hover, .btn.danger:hover { background: var(--aira-btn-danger-bg-hover); }
/* Disabled wins over every interactive state. The :hover/:active variants
   are listed so a disabled button is visually identical whether or not it's
   hovered (the variant hover selectors are 0,3,0, so the plain disabled rule
   alone would lose the tie). */
.btn:disabled, .btn[aria-disabled="true"],
.btn:disabled:hover, .btn[aria-disabled="true"]:hover,
.btn:disabled:active, .btn[aria-disabled="true"]:active {
  background: var(--aira-bg-disabled); color: var(--aira-text-disabled);
  border-color: var(--aira-border-subtle); cursor: not-allowed;
}

/* ───────────────────────── ICON BUTTONS ───────────────────────── */
.iconbtn {
  display: inline-grid; place-items: center;
  width: 32px; height: 32px;
  background: transparent;
  border: 0;
  border-radius: var(--aira-radius-sm);
  color: var(--aira-text-secondary);
  cursor: pointer;
  transition: background var(--aira-motion-fast), color var(--aira-motion-fast);
}
.iconbtn.sm { width: 28px; height: 28px; }
.iconbtn.lg { width: 44px; height: 44px; }
.iconbtn:hover { background: var(--aira-bg-hover); color: var(--aira-text-primary); }
.iconbtn:active { background: var(--aira-bg-pressed); }
.iconbtn:disabled, .iconbtn[aria-disabled="true"] { color: var(--aira-text-disabled); cursor: not-allowed; opacity: 0.5; }
.iconbtn svg { width: 18px; height: 18px; stroke-width: 1.75; }

/* ───────────────────────── INPUTS ───────────────────────── */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 240px; }
.field label { font: var(--aira-t-label-md); color: var(--aira-text-primary); }
.field input, .field textarea, .field .control {
  font: var(--aira-t-body-md); color: var(--aira-text-primary);
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-sm);
  padding: 8px 12px;
  height: 36px;
  min-width: 0;
  transition: border-color var(--aira-motion-fast), box-shadow var(--aira-motion-fast);
}
.field textarea { height: auto; min-height: 80px; resize: vertical; padding-top: 10px; }
.field input::placeholder, .field textarea::placeholder { color: var(--aira-text-placeholder); }
.field input:hover, .field .control:hover { border-color: var(--aira-border-strong); }
.field input:focus, .field textarea:focus, .field .control:focus-within { outline: none; border-color: var(--aira-border-focus); box-shadow: 0 0 0 3px rgba(52, 56, 201, 0.12); }
.field input:disabled, .field textarea:disabled, .field .control[aria-disabled="true"] { background: var(--aira-bg-disabled); color: var(--aira-text-disabled); cursor: not-allowed; }
.field input[readonly] { background: var(--aira-bg-sunken); }
.field.error input, .field.error textarea, .field.error .control { border-color: var(--aira-border-danger); }
.field.warning input, .field.warning textarea, .field.warning .control { border-color: var(--aira-border-warning); }
.field.success input, .field.success textarea, .field.success .control { border-color: var(--aira-border-success); }
.field .helper { font: var(--aira-t-caption); color: var(--aira-text-helper); }
.field.error .helper { color: var(--aira-status-danger-text); }

/* ───────────────────────── CHIPS / TAGS / BADGES / PILLS ───────────────────────── */
.chip {
  display: inline-flex; align-items: center; gap: var(--aira-sp-1);
  height: 24px; padding: 0 var(--aira-sp-2);
  font: var(--aira-t-label-sm);
  color: var(--aira-text-secondary);
  background: var(--aira-bg-sunken);
  border-radius: var(--aira-radius-pill);
}
.chip::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background-color: var(--aira-text-tertiary);
}
.chip.brand { background: var(--aira-status-brand-bg); color: var(--aira-status-brand-text); }
.chip.brand::before { background: var(--aira-text-link); }
.chip.success { background: var(--aira-status-success-bg); color: var(--aira-status-success-text); }
.chip.success::before { background: var(--aira-green-400); }
.chip.warning { background: var(--aira-status-warning-bg); color: var(--aira-status-warning-text); }
.chip.warning::before { background: var(--aira-amber-300); }
.chip.danger { background: var(--aira-status-danger-bg); color: var(--aira-status-danger-text); }
.chip.danger::before { background: var(--aira-red-400); }
.chip.info { background: var(--aira-status-info-bg); color: var(--aira-status-info-text); }
.chip.info::before { background: var(--aira-info-200); }

.tag {
  display: inline-block; padding: 2px 8px;
  font: var(--aira-t-label-sm); color: var(--aira-text-secondary);
  background: var(--aira-bg-sunken); border-radius: var(--aira-radius-sm);
}
.badge {
  display: inline-grid; place-items: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  font: var(--aira-t-overline); letter-spacing: 0;
  color: var(--aira-btn-primary-text); background: var(--aira-bg-brand);
  border-radius: var(--aira-radius-pill);
}
.pill {
  display: inline-flex; align-items: center; gap: var(--aira-sp-1);
  padding: 2px 10px;
  font: var(--aira-t-label-sm);
  border-radius: var(--aira-radius-pill);
  background: var(--aira-status-neutral-bg); color: var(--aira-status-neutral-text);
}
.pill.draft     { background: var(--aira-approval-draft-bg); color: var(--aira-approval-draft-text); }
.pill.awaiting  { background: var(--aira-approval-awaiting-bg); color: var(--aira-approval-awaiting-text); }
.pill.upcoming  { background: var(--aira-approval-upcoming-bg); color: var(--aira-approval-upcoming-text); }
.pill.approved  { background: var(--aira-approval-approved-bg); color: var(--aira-approval-approved-text); }
.pill.live      { background: var(--aira-approval-live-bg); color: var(--aira-approval-live-text); }
.pill.rejected  { background: var(--aira-approval-rejected-bg); color: var(--aira-approval-rejected-text); }
.pill.danger    { background: var(--aira-status-danger-bg); color: var(--aira-status-danger-text); }

/* ───────────────────────── AVATAR ───────────────────────── */
.avatar {
  display: inline-grid; place-items: center;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--aira-avatar-grad);
  color: #FFFFFF;
  font: 500 13px/1 var(--aira-font-sans);
  letter-spacing: 0.02em;
  flex-shrink: 0;
}
.avatar.sm { width: 24px; height: 24px; font-size: 11px; }
.avatar.lg { width: 40px; height: 40px; font-size: 15px; }
.avatar.sm.aira svg { width: 14px; height: 14px; }
.avatar.lg.aira svg { width: 24px; height: 24px; }

/* ───────────────────────── CITATION ───────────────────────── */
.citation {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px;
  background: var(--aira-citation-bg);
  border: 1px solid var(--aira-citation-border);
  color: var(--aira-citation-text);
  border-radius: var(--aira-radius-pill);
  font: var(--aira-t-label-sm);
  transition: background var(--aira-motion-fast), border-color var(--aira-motion-fast), color var(--aira-motion-fast);
}
.citation:hover, .citation:focus-visible {
  background: var(--aira-citation-bg-hover);
  border-color: var(--aira-citation-border-hover);
  color: var(--aira-citation-text-hover);
  text-decoration: none;
}
.citation .num {
  display: inline-grid; place-items: center;
  min-width: 16px; height: 16px;
  padding: 0 4px;
  background: var(--aira-bg-surface); color: var(--aira-citation-text);
  border-radius: var(--aira-radius-pill);
  font: var(--aira-t-overline);
}
.citation:hover .num, .citation:focus-visible .num {
  color: var(--aira-citation-text-hover);
}
.citation-list h6 { font: var(--aira-t-overline); letter-spacing: var(--aira-t-overline-tracking); color: var(--aira-text-tertiary); margin: 0 0 var(--aira-sp-2); }
.citation-list > div { margin-bottom: var(--aira-sp-1); }

/* ───────────────────────── TOOLTIP / POPOVER ───────────────────────── */
.tip {
  display: inline-block;
  padding: 6px 10px;
  background: var(--aira-tooltip-bg); color: var(--aira-tooltip-text);
  font: var(--aira-t-label-sm);
  border-radius: var(--aira-radius-sm);
  max-width: 280px;
}
.popover {
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-md);
  padding: var(--aira-sp-3) var(--aira-sp-4);
  box-shadow: var(--aira-shadow-md);
  max-width: 320px;
}
.popover h4 { margin: 0 0 var(--aira-sp-1); font: var(--aira-t-h4); }
.popover p  { margin: 0; font: var(--aira-t-body-sm); color: var(--aira-text-secondary); }
.popover .foot {
  display: flex; gap: var(--aira-sp-2); justify-content: flex-end;
  margin-top: var(--aira-sp-3);
}

/* ───────────────────────── KBD ───────────────────────── */
kbd {
  display: inline-grid; place-items: center;
  min-width: 22px; height: 22px; padding: 0 6px;
  font: var(--aira-t-overline); letter-spacing: 0;
  color: var(--aira-text-secondary);
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-bottom-width: 2px;
  border-radius: var(--aira-radius-xs);
}

/* ───────────────────────── DIVIDER / SPINNER / SKELETON ───────────────────────── */
.divider { height: 1px; background: var(--aira-border-default); margin: var(--aira-sp-4) 0; }
.mini-spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--aira-indigo-200);
  border-top-color: var(--aira-indigo-600);
  border-radius: 50%;
  animation: spin 800ms linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton { background: linear-gradient(90deg, var(--aira-bg-sunken) 0%, color-mix(in oklab, var(--aira-indigo-400) 16%, var(--aira-bg-hover)) 42%, color-mix(in oklab, var(--aira-sky-400) 16%, var(--aira-bg-hover)) 58%, var(--aira-bg-sunken) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: var(--aira-radius-sm); height: 14px; }
.skel-bubble { height: 60px; border-radius: var(--aira-radius-md); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ───────────────────────── DROPDOWN (Molecule) ───────────────────────── */
.dd { position: relative; min-width: 240px; }
.dd-trigger {
  display: flex; align-items: center; gap: var(--aira-sp-2);
  width: 100%;
  padding: 0 var(--aira-sp-3);
  height: 36px;
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-sm);
  font: var(--aira-t-body-md);
  color: var(--aira-text-primary);
  cursor: pointer;
  text-align: start;
}
.dd.sm .dd-trigger { height: 28px; padding: 0 var(--aira-sp-2); font: var(--aira-t-body-sm); }
.dd.lg .dd-trigger { height: 44px; padding: 0 var(--aira-sp-4); font: var(--aira-t-body-lg); }
.dd-trigger:hover { border-color: var(--aira-border-strong); }
.dd.is-open .dd-trigger { border-color: var(--aira-border-focus); box-shadow: 0 0 0 3px rgba(52,56,201,0.12); }
.dd-trigger .caret { margin-inline-start: auto; color: var(--aira-text-tertiary); flex-shrink: 0; }
.dd-trigger .caret svg { stroke-width: 1.5; }
.dd-trigger .value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-trigger .placeholder { color: var(--aira-text-placeholder); }
.dd-trigger .chip-summary { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; background: var(--aira-bg-brand-subtle); color: var(--aira-text-link); border-radius: var(--aira-radius-pill); font: var(--aira-t-label-sm); }
.dd-menu {
  position: absolute; inset-inline-start: 0; inset-inline-end: 0; top: calc(100% + 4px);
  z-index: 40;
  max-height: 280px; overflow-y: auto;
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-sm);
  box-shadow: var(--aira-shadow-md);
  padding: 4px;
}
.dd-search {
  padding: 8px;
  border-bottom: 1px solid var(--aira-border-subtle);
  margin-bottom: 4px;
}
.dd-search input {
  width: 100%; height: 30px; padding: 0 8px;
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-sm);
  font: var(--aira-t-body-sm);
  background: var(--aira-bg-surface);
  color: var(--aira-text-primary);
}
.dd-option {
  display: flex; align-items: center; gap: var(--aira-sp-2);
  padding: 8px 10px;
  border-radius: var(--aira-radius-sm);
  font: var(--aira-t-body-md);
  color: var(--aira-text-primary);
  cursor: pointer;
  user-select: none;
}
.dd-option:hover { background: var(--aira-bg-hover); }
.dd-option[aria-selected="true"] { background: var(--aira-bg-selected); color: var(--aira-text-primary); }
.dd-option .check { margin-inline-start: auto; color: var(--aira-text-link); display: none; }
.dd-option[aria-selected="true"] .check { display: inline-block; }
.dd-option .checkbox-square {
  width: 16px; height: 16px; border: 1px solid var(--aira-border-strong);
  border-radius: var(--aira-radius-xs);
  display: inline-grid; place-items: center;
  background: var(--aira-bg-surface);
  flex-shrink: 0;
}
.dd-option[aria-selected="true"] .checkbox-square {
  background: var(--aira-bg-brand); border-color: var(--aira-bg-brand);
}
.dd-option[aria-selected="true"] .checkbox-square svg { stroke: #fff; width: 12px; height: 12px; display: block; }
.dd-option .checkbox-square svg { display: none; }
.dd-empty, .dd-loading {
  padding: var(--aira-sp-3); font: var(--aira-t-body-sm); color: var(--aira-text-secondary);
  display: flex; align-items: center; gap: var(--aira-sp-2);
}

/* ───────────────────────── CHECKBOX / RADIO / TOGGLE ───────────────────────── */
.opt { display: flex; align-items: center; gap: var(--aira-sp-2); font: var(--aira-t-body-md); color: var(--aira-text-primary); cursor: pointer; }
.opt input[type="checkbox"], .opt input[type="radio"] {
  width: 16px; height: 16px;
  accent-color: var(--aira-bg-brand);
  cursor: pointer;
}
.opt input:disabled { cursor: not-allowed; opacity: 0.5; }
.opt input:disabled + span, .opt:has(input:disabled) { color: var(--aira-text-disabled); cursor: not-allowed; }

.toggle { display: inline-flex; align-items: center; gap: var(--aira-sp-2); cursor: pointer; font: var(--aira-t-body-md); }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle .track {
  width: 32px; height: 18px; background: var(--aira-slate-300); border-radius: var(--aira-radius-pill);
  position: relative; transition: background var(--aira-motion-fast);
}
.toggle .track::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; background: #fff; border-radius: 50%;
  transition: transform var(--aira-motion-fast);
  box-shadow: var(--aira-shadow-xs);
}
.toggle input:checked + .track { background: var(--aira-bg-brand); }
.toggle input:checked + .track::after { transform: translateX(14px); }
.toggle input:disabled + .track { opacity: 0.5; cursor: not-allowed; }

/* ───────────────────────── STEPPER / PROGRESS ───────────────────────── */
.stepper { display: flex; gap: var(--aira-sp-4); align-items: center; }
.stepper .step { display: flex; align-items: center; gap: var(--aira-sp-2); font: var(--aira-t-label-md); color: var(--aira-text-tertiary); }
.stepper .step .num {
  width: 24px; height: 24px; display: inline-grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--aira-border-default);
  font: var(--aira-t-overline); color: var(--aira-text-tertiary); background: var(--aira-bg-surface);
}
.stepper .step.done .num { background: var(--aira-bg-brand); border-color: var(--aira-bg-brand); color: #fff; }
.stepper .step.done { color: var(--aira-text-primary); }
.stepper .step.active .num { border-color: var(--aira-bg-brand); color: var(--aira-text-link); }
.stepper .step.active { color: var(--aira-text-primary); }
.progress { width: 100%; height: 8px; background: var(--aira-bg-sunken); border-radius: var(--aira-radius-pill); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--aira-bg-brand); }

/* ───────────────────────── FEEDBACK CONTROL (chevrons) ───────────────────────── */
.feedback {
  display: inline-flex; align-items: center; gap: var(--aira-sp-1);
}
.feedback button {
  display: inline-grid; place-items: center;
  width: 32px; height: 32px;
  background: transparent; border: 0;
  color: var(--aira-text-secondary);
  border-radius: var(--aira-radius-sm);
  cursor: pointer;
  transition: background var(--aira-motion-fast), color var(--aira-motion-fast);
}
.feedback button:hover { background: var(--aira-bg-hover); color: var(--aira-text-primary); }
.feedback button.selected { color: var(--aira-text-link); background: transparent; }
.feedback button.selected svg { fill: currentColor; }
.feedback .sep { display: none; }
.feedback button svg { width: 18px; height: 18px; stroke-width: 1.75; fill: none; }
/* Inside an action row, the .actions button padding would squeeze the fixed-width
   feedback buttons and shrink the thumbs. Let them size to content so the thumbs
   render at the same 18px as Copy / Support. */
.actions .feedback button { width: auto; }

/* ───────────────────────── ENGINEERING HANDOFF ─────────────────────────
   Per-component bridge to the developer build: the dev component name,
   the libraries it's built with, and a React/Tailwind usage snippet.
   Name + libs stay visible in Designer view; the code snippet hides
   (same convention as other code on the page). */
.handoff {
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-md);
  background: var(--aira-bg-surface-alt);
  padding: var(--aira-sp-3) var(--aira-sp-4);
  margin-bottom: var(--aira-sp-4);
}
.handoff-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--aira-sp-2) var(--aira-sp-3); margin-bottom: var(--aira-sp-3); }
.handoff-name {
  font: var(--aira-t-label-md); font-family: var(--aira-font-mono);
  color: var(--aira-text-accent);
  background: var(--aira-ai-accent-surface);
  border: 1px solid var(--aira-ai-accent-border);
  padding: 2px 8px; border-radius: var(--aira-radius-sm);
}
.handoff-libs { font: var(--aira-t-caption); color: var(--aira-text-tertiary); }
.handoff-libs .lib {
  font-family: var(--aira-font-mono); color: var(--aira-text-secondary);
  background: var(--aira-code-bg-inline); padding: 1px 6px;
  border-radius: var(--aira-radius-xs); margin-inline-end: 2px;
}
.handoff-snippet {
  margin: 0; background: var(--aira-code-bg);
  border: 1px solid var(--aira-code-border); border-radius: var(--aira-radius-sm);
  padding: var(--aira-sp-3); overflow-x: auto;
  font: var(--aira-t-code); color: var(--aira-code-fg);
}
[data-view="designer"] .handoff-snippet { display: none; }

/* ───────────────────────── ACTION ROW ───────────────────────── */
.actions {
  display: flex; align-items: center; gap: var(--aira-sp-2);
  margin-top: var(--aira-sp-3);
}
.actions button {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 0;
  padding: 6px 10px;
  font: var(--aira-t-label-sm); color: var(--aira-text-tertiary);
  border-radius: var(--aira-radius-sm);
  cursor: pointer;
  transition: background var(--aira-motion-fast), color var(--aira-motion-fast);
}
.actions button:hover { background: var(--aira-bg-hover); color: var(--aira-text-primary); }

/* ───────────────────────── TABS ───────────────────────── */
.tabs {
  display: flex; gap: var(--aira-sp-4);
  border-bottom: 1px solid var(--aira-border-default);
}
.tabs [role="tab"] {
  appearance: none; border: 0; background: transparent;
  padding: 10px 0; font: var(--aira-t-label-md); color: var(--aira-text-secondary);
  cursor: pointer; position: relative;
}
.tabs [role="tab"]:hover { color: var(--aira-text-primary); }
.tabs [role="tab"][aria-selected="true"] {
  color: var(--aira-text-primary);
}
.tabs [role="tab"][aria-selected="true"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--aira-bg-brand);
}

/* ───────────────────────── BREADCRUMB ───────────────────────── */
.breadcrumb { display: flex; align-items: center; gap: var(--aira-sp-2); font: var(--aira-t-body-sm); color: var(--aira-text-tertiary); }
.breadcrumb a { color: var(--aira-text-secondary); }
.breadcrumb .sep { color: var(--aira-text-tertiary); }

/* ───────────────────────── TOAST / BANNER / NUDGE ───────────────────────── */
.toast {
  display: flex; align-items: flex-start; gap: var(--aira-sp-3);
  padding: 12px 14px; border-radius: var(--aira-radius-md);
  border: 1px solid var(--aira-border-default);
  background: var(--aira-bg-surface);
  box-shadow: var(--aira-shadow-md);
  max-width: 420px;
}
.toast.success { border-color: var(--aira-border-success); }
.toast.danger { border-color: var(--aira-border-danger); }
.banner {
  padding: 12px 14px; border-radius: var(--aira-radius-md);
  border: 1px solid var(--aira-border-default);
  background: var(--aira-bg-surface);
}
.banner.info { background: var(--aira-status-info-bg); border-color: var(--aira-info-100); color: var(--aira-status-info-text); }
.banner.warning { background: var(--aira-status-warning-bg); border-color: var(--aira-border-warning); color: var(--aira-status-warning-text); }
.banner.danger { background: var(--aira-status-danger-bg); border-color: var(--aira-border-danger); color: var(--aira-status-danger-text); }
.banner.success { background: var(--aira-status-success-bg); border-color: var(--aira-border-success); color: var(--aira-status-success-text); }
.nudge {
  padding: 14px 16px;
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-inline-start: 4px solid var(--aira-bg-brand);
  border-radius: var(--aira-radius-md);
}
.nudge.bug { border-inline-start-color: var(--aira-border-warning); }
.nudge .t1 { font: var(--aira-t-label-md); color: var(--aira-text-primary); margin-bottom: 4px; }
.nudge .t2 { font: var(--aira-t-body-sm); color: var(--aira-text-secondary); }

/* ───────────────────────── COLOR DOC · surface preview ───────────────────────── */
.surface-preview { display: grid; grid-template-columns: repeat(auto-fit, minmax(248px, 1fr)); gap: var(--aira-sp-3); }
.surface-preview .sp-mode { margin: 0; padding: var(--aira-sp-3); border-radius: var(--aira-radius-lg); display: grid; gap: var(--aira-sp-3); }
.surface-preview .sp-tag { font: var(--aira-t-label-sm); }
.surface-preview .sp-tag code { background: transparent; padding: 0; border: 0; }
.surface-preview .sp-card { padding: var(--aira-sp-4); border-radius: var(--aira-radius-md); display: grid; gap: 2px; }
.surface-preview .sp-eyebrow { font: var(--aira-t-overline); letter-spacing: var(--aira-t-overline-tracking); }
.surface-preview .sp-value { font: var(--aira-t-h2); }
.surface-preview .sp-sub { font: var(--aira-t-label-md); }
.surface-preview .sp-meta { font: var(--aira-t-caption); margin-top: var(--aira-sp-1); }
.surface-preview .sp-rail { font: var(--aira-t-label-sm); padding: var(--aira-sp-2) var(--aira-sp-3); border-radius: var(--aira-radius-sm); }
.surface-preview .sp-rail code { background: transparent; padding: 0; border: 0; }

/* ───────────────────────── SELECTION CARD ───────────────────────── */
.selection {
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-lg);
  background: var(--aira-bg-surface);
  padding: var(--aira-sp-4);
  max-width: 560px;
}
.selection .head { display: flex; align-items: center; gap: var(--aira-sp-3); margin-bottom: var(--aira-sp-3); }
/* Title absorbs the free space so the counter + close always sit flush at the
   right edge — works whether or not a counter is present (free-text variants). */
.selection .title { font: var(--aira-t-h4); margin: 0; margin-inline-end: auto; }
.selection .counter { font: var(--aira-t-label-sm); color: var(--aira-text-tertiary); }
.selection .close {
  flex: 0 0 auto;
  align-self: start;
  background: transparent; border: 0;
  width: 28px; height: 28px;
  display: inline-grid; place-items: center;
  border-radius: var(--aira-radius-sm); color: var(--aira-text-tertiary);
  cursor: pointer;
}
.selection .close:hover { background: var(--aira-bg-hover); color: var(--aira-text-primary); }
.selection ol { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.selection .opt {
  display: flex; align-items: center; gap: var(--aira-sp-3);
  padding: 10px 12px;
  border-radius: var(--aira-radius-sm);
  cursor: pointer;
  transition: background var(--aira-motion-fast);
}
.selection .opt:hover { background: var(--aira-bg-hover); }
.selection .opt[aria-selected="true"] { background: var(--aira-bg-selected); }
.selection .opt[aria-selected="true"] .num { background: var(--aira-bg-brand); color: var(--aira-btn-primary-text); border-color: var(--aira-bg-brand); }
.selection .opt .num {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px; border-radius: var(--aira-radius-sm);
  border: 1px solid var(--aira-border-default); background: var(--aira-bg-surface);
  font: var(--aira-t-label-sm); color: var(--aira-text-secondary);
}
.selection .opt .lbl { font: var(--aira-t-body-md); color: var(--aira-text-primary); }
.selection .else {
  display: flex; align-items: center; gap: var(--aira-sp-3);
  margin-top: var(--aira-sp-3); padding: 10px 12px;
  border-top: 1px solid var(--aira-border-default);
  border-radius: 0 0 var(--aira-radius-md) var(--aira-radius-md);
  cursor: pointer;
  transition: background var(--aira-motion-fast);
}
.selection .else:hover { background: var(--aira-bg-accent-subtle); }
.selection .else:focus-visible { outline: 2px solid var(--aira-border-focus); outline-offset: -2px; }
.selection .else .icon { color: var(--aira-text-tertiary); display: inline-grid; place-items: center; width: 22px; height: 22px; }
.selection .else .lbl { font: var(--aira-t-body-md); color: var(--aira-text-primary); }
.selection .else .chev {
  margin-inline-start: auto;
  display: inline-grid; place-items: center;
  color: var(--aira-text-tertiary);
  transition: transform var(--aira-motion-fast);
}
.selection .else[aria-expanded="true"] .chev { transform: rotate(180deg); }
.selection .hint {
  margin-top: var(--aira-sp-3);
  font: var(--aira-t-caption); color: var(--aira-text-tertiary);
}
.selection .hint kbd { margin-inline: 2px; }
/* Free-text composer — "Something else" expansion + open-ended variant */
.selection .else[data-else-toggle] { user-select: none; }
.selection .freetext { margin-top: var(--aira-sp-2); }
.selection .freetext[hidden] { display: none; }
.selection .ft-field {
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-md);
  background: var(--aira-bg-surface);
  transition: border-color var(--aira-motion-fast), box-shadow var(--aira-motion-fast);
}
.selection .ft-field:focus-within { border-color: var(--aira-border-focus); box-shadow: var(--aira-shadow-focus); }
.selection .ft-field textarea {
  display: block; width: 100%; box-sizing: border-box;
  border: 0; background: transparent; resize: none; outline: none;
  padding: 10px 12px;
  font: var(--aira-t-body-md); color: var(--aira-text-primary);
  min-height: 64px; max-height: 168px; overflow-y: auto;
}
.selection .ft-field textarea::placeholder { color: var(--aira-text-placeholder); }
.selection .ft-foot {
  display: flex; align-items: center; gap: var(--aira-sp-3);
  padding: 6px 8px 6px 12px;
  border-top: 1px solid var(--aira-border-subtle);
}
.selection .ft-hint { font: var(--aira-t-caption); color: var(--aira-text-tertiary); }
.selection .ft-count { margin-inline-start: auto; font: var(--aira-t-caption); color: var(--aira-text-tertiary); font-variant-numeric: tabular-nums; }
.selection .ft-send {
  border: 0; cursor: pointer;
  padding: 7px 16px; border-radius: var(--aira-radius-sm);
  font: var(--aira-t-label-sm);
  background: var(--aira-btn-primary-bg); color: var(--aira-btn-primary-text);
  transition: background var(--aira-motion-fast);
}
.selection .ft-send:hover { background: var(--aira-btn-primary-bg-hover); }
.selection .ft-send:active { background: var(--aira-btn-primary-bg-press); }
.selection .ft-send:disabled { background: var(--aira-bg-disabled); color: var(--aira-text-disabled); cursor: not-allowed; }
.selection .ft-send:focus-visible { outline: 2px solid var(--aira-border-focus); outline-offset: 2px; }

/* ───────────────────────── CHAT MESSAGE ───────────────────────── */
.thread {
  display: flex; flex-direction: column; gap: var(--aira-sp-4);
  max-width: 760px;
}
.msg { display: flex; gap: var(--aira-sp-3); align-items: flex-start; }
.msg.user { justify-content: flex-end; }
.msg.user .body {
  background: var(--aira-bg-sunken); color: var(--aira-text-primary);
  padding: 10px 14px;
  border-radius: var(--aira-radius-lg);
  max-width: 80%;
  font: var(--aira-t-body-md);
}
.msg.ai .body { font: var(--aira-t-body-md); color: var(--aira-text-primary); flex: 1; min-width: 0; }
.msg.ai .meta { display: flex; align-items: center; gap: var(--aira-sp-2); margin-bottom: 4px; font: var(--aira-t-caption); color: var(--aira-text-tertiary); }
.msg.system { font: var(--aira-t-body-sm); font-style: italic; color: var(--aira-text-tertiary); padding-inline-start: 0; }
.msg.error .body {
  flex: 0 1 auto; align-self: flex-start;
  padding: 6px 10px;
  background: var(--aira-state-ai-error-bg);
  border: 1px solid var(--aira-state-ai-error-border);
  color: var(--aira-state-ai-error-text);
  border-radius: var(--aira-radius-sm);
  font: var(--aira-t-body-sm);
}

/* ───────────────────────── COMPOSER ───────────────────────── */
.composer {
  display: flex; align-items: center; gap: var(--aira-sp-2);
  padding: 6px 6px 6px 10px;
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-pill);
  max-width: 760px;
}
.composer:focus-within { border-color: var(--aira-border-focus); box-shadow: 0 0 0 3px rgba(52,56,201,0.10); }
.composer input {
  flex: 1; min-width: 0;
  border: 0; outline: 0; background: transparent;
  font: var(--aira-t-body-md); color: var(--aira-text-primary);
}
.composer input::placeholder { color: var(--aira-text-placeholder); }
.composer .iconbtn { width: 32px; height: 32px; border-radius: 50%; color: var(--aira-text-secondary); }
.composer .send {
  display: inline-grid; place-items: center;
  width: 36px; height: 36px;
  background: var(--aira-bg-disabled); color: var(--aira-text-disabled);
  border: 0; border-radius: 50%;
  cursor: not-allowed;
  transition: background var(--aira-motion-fast), color var(--aira-motion-fast);
}
.composer.has-text .send { background: var(--aira-btn-primary-bg); color: var(--aira-btn-primary-text); cursor: pointer; }
.composer.has-text .send:hover { background: var(--aira-btn-primary-bg-hover); }
.composer.is-generating .send { background: var(--aira-bg-brand); color: #fff; cursor: pointer; }
.composer.is-generating input::placeholder { color: var(--aira-text-tertiary); }
.composer.is-readonly { opacity: 0.6; pointer-events: none; }

/* ───────────────────────── APPROVAL CARD ───────────────────────── */
.approval {
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-lg);
  padding: var(--aira-sp-4);
  max-width: 760px;
}
.approval .head { display: flex; align-items: center; gap: var(--aira-sp-3); margin-bottom: var(--aira-sp-3); }
.approval .head h3 { margin: 0; font: var(--aira-t-h4); flex: 1; }
.approval .head .spacer { flex: 1; }
.approval .body { margin-bottom: var(--aira-sp-3); }
.approval .footer { display: flex; align-items: center; gap: var(--aira-sp-2); flex-wrap: wrap; }
.approval .footer .spacer { flex: 1; }

/* ───────────────────────── DIFF ───────────────────────── */
.diff {
  border: 1px solid var(--aira-code-border);
  border-radius: var(--aira-radius-md);
  background: var(--aira-code-bg);
  overflow: auto;
  font: var(--aira-t-code);
}
.diff .line { display: flex; align-items: stretch; }
.diff .line .gutter {
  flex: 0 0 36px;
  text-align: end;
  padding: 1px 8px;
  color: var(--aira-diff-gutter-fg);
  background: var(--aira-diff-gutter-bg);
  border-inline-end: 1px solid var(--aira-border-subtle);
  user-select: none;
}
.diff .line .body { padding: 1px 8px; flex: 1; }
.diff .line.add { background: var(--aira-diff-add-bg); }
.diff .line.add .body { color: var(--aira-diff-add-fg); }
.diff .line.add .body::before { content: "+ "; }
.diff .line.remove { background: var(--aira-diff-remove-bg); }
.diff .line.remove .body { color: var(--aira-diff-remove-fg); }
.diff .line.remove .body::before { content: "- "; }
.diff .line.context .body { color: var(--aira-diff-context-fg); }

/* ───────────────────────── CODE BLOCK ───────────────────────── */
.code-block {
  border: 1px solid var(--aira-code-border);
  border-radius: var(--aira-radius-md);
  background: var(--aira-code-bg);
  overflow: hidden;
}
.code-block .head {
  display: flex; align-items: center; gap: var(--aira-sp-2);
  padding: 8px 12px;
  border-bottom: 1px solid var(--aira-border-subtle);
  background: var(--aira-bg-surface);
}
.code-block .lang { font: var(--aira-t-label-sm); color: var(--aira-text-tertiary); }
.code-block .head .spacer { flex: 1; }
.code-block .head button {
  background: transparent; border: 0;
  padding: 4px 8px; font: var(--aira-t-label-sm); color: var(--aira-text-secondary);
  border-radius: var(--aira-radius-sm); cursor: pointer;
}
.code-block .head button:hover { background: var(--aira-bg-hover); color: var(--aira-text-primary); }
.code-block pre { padding: 12px 16px; color: var(--aira-code-fg); overflow-x: auto; }
.tok-k { color: var(--aira-syntax-keyword); }
.tok-s { color: var(--aira-syntax-string); }
.tok-n { color: var(--aira-syntax-number); }
.tok-c { color: var(--aira-syntax-comment); }
.tok-o { color: var(--aira-syntax-operator); }
.tok-f { color: var(--aira-syntax-function); }
.tok-p { color: var(--aira-syntax-punctuation); }

/* ───────────────────────── AGENT ACTIVITY ───────────────────────── */
.activity {
  display: flex; align-items: center; gap: var(--aira-sp-3);
  padding: 10px 14px;
  background: var(--aira-state-ai-thinking-bg);
  border: 1px solid var(--aira-state-ai-thinking-border);
  border-radius: var(--aira-radius-md);
  color: var(--aira-state-ai-thinking-text);
  max-width: 560px;
  font: var(--aira-t-body-sm);
}
.activity .mini-spinner { width: 14px; height: 14px; flex-shrink: 0; }
.activity .aira-mark { display: none; }

/* aiRA sparkle logomark — 5 px radius at every size */
svg[viewBox="0 0 22 22"] { border-radius: 5px; }

@keyframes sparkle {
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.18); opacity: 1; }
}
.activity .step { font: var(--aira-t-label-md); color: var(--aira-text-primary); }
.activity .detail { color: var(--aira-text-secondary); }

.activity-list {
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-md);
  background: var(--aira-bg-surface);
  padding: var(--aira-sp-3);
  display: flex; flex-direction: column; gap: 4px;
  max-width: 560px;
}
.activity-list .step-line {
  display: flex; align-items: center; gap: var(--aira-sp-3);
  padding: 8px 8px;
  border-radius: var(--aira-radius-sm);
  font: var(--aira-t-body-md);
  color: var(--aira-text-primary);
  transition: color var(--aira-motion-base);
}
.activity-list .step-line .ic {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--aira-border-strong);
  display: grid; place-items: center;
  flex-shrink: 0;
  background: var(--aira-bg-surface);
  transition: background var(--aira-motion-base), border-color var(--aira-motion-base);
}
.activity-list .step-line .ic svg { width: 12px; height: 12px; stroke: #fff; opacity: 0; transition: opacity var(--aira-motion-base); }
.activity-list .step-line.active .ic { border-color: var(--aira-bg-brand); background: var(--aira-bg-brand-subtle); }
.activity-list .step-line.active .ic::after {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: var(--aira-bg-brand);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.5; }
}
.activity-list .step-line.done .ic { background: var(--aira-bg-brand); border-color: var(--aira-bg-brand); }
.activity-list .step-line.done .ic svg { opacity: 1; }
.activity-list .step-line.done {
  color: var(--aira-text-tertiary);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}
.activity-list .step-line .label { flex: 1; }
.activity-list .step-line time {
  font: var(--aira-t-caption); color: var(--aira-text-tertiary);
}

/* ───────────────────────── MODAL / SHEET ───────────────────────── */
.modal-stage, .sheet-stage {
  position: relative; padding: var(--aira-sp-6);
  background: var(--aira-bg-sunken);
  border-radius: var(--aira-radius-md);
  min-height: 280px;
  display: grid; place-items: center;
}
.scrim { position: absolute; inset: 0; background: var(--aira-bg-overlay); border-radius: var(--aira-radius-md); }
.modal {
  position: relative; z-index: 1;
  background: var(--aira-bg-surface);
  border-radius: var(--aira-radius-lg);
  box-shadow: var(--aira-shadow-lg);
  max-width: 440px; width: 100%;
  overflow: hidden;
}
.modal .head { padding: 16px 20px 0; }
.modal .head h3 { margin: 0; font: var(--aira-t-h3); }
.modal .body { padding: 12px 20px 16px; color: var(--aira-text-secondary); font: var(--aira-t-body-md); }
.modal .foot { display: flex; gap: var(--aira-sp-2); justify-content: flex-end; padding: 12px 20px 16px; border-top: 1px solid var(--aira-border-subtle); }

.sheet {
  position: relative; z-index: 1;
  background: var(--aira-bg-surface);
  border-radius: var(--aira-radius-xl) var(--aira-radius-xl) 0 0;
  padding: var(--aira-sp-4) var(--aira-sp-5) calc(var(--aira-sp-5) + var(--aira-safe-bottom));
  width: min(420px, 100%);
  align-self: end;
  box-shadow: var(--aira-shadow-lg);
}
.sheet .handle {
  width: 36px; height: 4px; border-radius: 999px;
  background: var(--aira-border-strong);
  margin: 0 auto var(--aira-sp-3);
}
.sheet h3 { margin: 0 0 var(--aira-sp-2); font: var(--aira-t-h4); }

/* ───────────────────────── LIST ROW ───────────────────────── */
.list { background: var(--aira-bg-surface); border: 1px solid var(--aira-border-default); border-radius: var(--aira-radius-md); overflow: hidden; }
.row-item {
  display: flex; align-items: center; gap: var(--aira-sp-3);
  padding: 12px 16px;
  border-bottom: 1px solid var(--aira-border-subtle);
  transition: background var(--aira-motion-fast);
}
.row-item:last-child { border-bottom: 0; }
.row-item:hover { background: var(--aira-bg-hover); }
.row-item .t1 { font: var(--aira-t-label-md); color: var(--aira-text-primary); }
.row-item .t2 { font: var(--aira-t-caption); color: var(--aira-text-tertiary); }
.row-item .trail { margin-inline-start: auto; font: var(--aira-t-caption); color: var(--aira-text-tertiary); }
.row-item.dense { padding: 8px 12px; }

/* ── Chat history rail variant (sessions list) ───────── */
.row-item.chat-row {
  border: 0; border-radius: var(--aira-radius-sm);
  padding: 8px 10px;
  gap: var(--aira-sp-2);
  position: relative; cursor: pointer;
  border-inline-start: 3px solid transparent;
}
.row-item.chat-row + .row-item.chat-row { margin-top: 2px; }
.row-item.chat-row:hover { background: var(--aira-bg-hover); }
.row-item.chat-row.is-active {
  background: var(--aira-bg-selected);
  border-inline-start-color: var(--aira-border-focus);
}
.row-item.chat-row .chat-meta { flex: 1; min-width: 0; }
.row-item.chat-row .t1 {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; text-overflow: ellipsis;
  font: var(--aira-t-label-sm); color: var(--aira-text-primary);
}
.row-item.chat-row .t2 { margin-top: 2px; font: var(--aira-t-caption); color: var(--aira-text-tertiary); }
.export-marker {
  display: inline-flex; align-items: center; gap: 2px;
  flex-shrink: 0;
  padding: 2px 6px;
  background: var(--aira-bg-surface); border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-pill);
  color: var(--aira-text-secondary);
}
.export-marker .ex-pip {
  display: inline-grid; place-items: center;
  width: 14px; height: 14px;
}
.export-marker .ex-pip svg { width: 12px; height: 12px; stroke-width: 1.75; }
.export-marker .ex-count {
  font: var(--aira-t-caption); font-weight: 600;
  color: var(--aira-text-primary);
  margin-inline-start: 2px;
}

/* ───────────────────────── DATA TABLE ───────────────────────── */
.dt-wrap { background: var(--aira-bg-surface); border: 1px solid var(--aira-border-default); border-radius: var(--aira-radius-md); overflow: hidden; }
.dt-filters {
  display: flex; align-items: center; gap: var(--aira-sp-2);
  padding: var(--aira-sp-2) var(--aira-sp-3);
  background: var(--aira-bg-surface-alt);
  border-bottom: 1px solid var(--aira-border-subtle);
  flex-wrap: wrap;
}
.dt-filters .label { font: var(--aira-t-caption); color: var(--aira-text-tertiary); margin-inline-end: var(--aira-sp-1); }
.dt-filters .filter-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font: var(--aira-t-label-sm); color: var(--aira-text-link);
  background: var(--aira-bg-brand-subtle);
  border-radius: var(--aira-radius-pill);
  padding: 2px 8px;
}
.dt-filters .filter-chip button {
  background: transparent; border: 0; color: inherit;
  display: inline-grid; place-items: center; cursor: pointer;
}
.dt { width: 100%; border-collapse: collapse; font: var(--aira-t-body-md); }
.dt thead th {
  text-align: start; font: var(--aira-t-label-sm); color: var(--aira-text-secondary);
  background: var(--aira-bg-surface-alt);
  border-bottom: 1px solid var(--aira-border-default);
  padding: 10px 12px;
  white-space: nowrap;
}
.dt thead th .col-h { display: inline-flex; align-items: center; gap: 4px; }
.dt thead th .col-h .icon {
  background: transparent; border: 0; padding: 2px;
  display: inline-grid; place-items: center;
  color: var(--aira-text-tertiary); cursor: pointer;
  border-radius: var(--aira-radius-xs);
}
.dt thead th .col-h .icon:hover { background: var(--aira-bg-hover); color: var(--aira-text-primary); }
.dt thead th .col-h .icon.is-active { color: var(--aira-text-link); }
.dt tbody td {
  padding: 12px;
  border-bottom: 1px solid var(--aira-border-subtle);
  color: var(--aira-text-primary);
}
.dt tbody tr:last-child td { border-bottom: 0; }
.dt tbody tr:hover { background: var(--aira-bg-hover); }
.dt td.num, .dt th.num { font-variant-numeric: tabular-nums; text-align: end; }
.delta-pos { color: var(--aira-delta-positive); }
.delta-neg { color: var(--aira-delta-negative); }

/* ───────────────────────── CHANGE LOG FEED ───────────────────────── */
.changelog {
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-md);
  padding: var(--aira-sp-4) var(--aira-sp-5);
  max-width: 720px;
}
.changelog .feed-filters {
  display: flex; gap: var(--aira-sp-2);
  margin-bottom: var(--aira-sp-4);
  flex-wrap: wrap;
}
.changelog .day {
  font: var(--aira-t-label-md); color: var(--aira-text-secondary);
  margin: var(--aira-sp-3) 0 var(--aira-sp-2);
}
.changelog .entries { position: relative; padding-inline-start: 28px; }
.changelog .entries::before {
  content: ""; position: absolute; inset-inline-start: 10px; top: 4px; bottom: 4px;
  width: 1px; background: var(--aira-border-default);
}
.changelog .entry { position: relative; padding: var(--aira-sp-3) 0; }
.changelog .entry::before {
  content: ""; position: absolute; inset-inline-start: -22px; top: 18px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--aira-bg-brand); border: 2px solid var(--aira-bg-surface);
  box-shadow: 0 0 0 1px var(--aira-border-default);
}
.changelog .entry .meta { display: flex; align-items: center; gap: var(--aira-sp-2); margin-bottom: 4px; font: var(--aira-t-caption); color: var(--aira-text-tertiary); }
.changelog .entry .meta .name { font: var(--aira-t-label-sm); color: var(--aira-text-primary); }
.changelog .entry .summary { font: var(--aira-t-body-md); color: var(--aira-text-primary); margin-bottom: var(--aira-sp-2); }
.changelog .ctype { padding: 1px 8px; border-radius: var(--aira-radius-pill); font: var(--aira-t-label-sm); }
.changelog .ctype.added    { background: var(--aira-status-success-bg); color: var(--aira-status-success-text); }
.changelog .ctype.changed  { background: var(--aira-status-warning-bg); color: var(--aira-status-warning-text); }
.changelog .ctype.removed  { background: var(--aira-status-danger-bg); color: var(--aira-status-danger-text); }
.changelog .ctype.fixed    { background: var(--aira-status-info-bg); color: var(--aira-status-info-text); }
.changelog .ctype.approved { background: var(--aira-status-brand-bg); color: var(--aira-status-brand-text); }
.changelog .ctype.reverted { background: var(--aira-status-neutral-bg); color: var(--aira-status-neutral-text); }

/* ───────────────────────── EMPTY / LOADING / ERROR ───────────────────────── */
.empty {
  padding: var(--aira-sp-8); text-align: center;
  background: var(--aira-bg-surface); border: 1px dashed var(--aira-border-default);
  border-radius: var(--aira-radius-md);
  color: var(--aira-text-secondary);
}
.empty h3 { margin: 0 0 var(--aira-sp-2); }

/* ───────────────────────── EMAIL CARD WRAPPER ───────────────────────── */
.email-frame {
  background: #F6F8FA;
  padding: var(--aira-sp-6);
  border-radius: var(--aira-radius-md);
}
.email-body {
  max-width: 560px; margin: 0 auto;
  background: #FFFFFF;
  border: 1px solid #E2E6EB;
  border-radius: 8px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #111827;
}

/* ───────────────────────── ICON GRID ───────────────────────── */
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--aira-sp-2); }
.icon-tile {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: var(--aira-sp-3);
  background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default);
  border-radius: var(--aira-radius-md);
  color: var(--aira-text-secondary);
  text-align: center;
}
.icon-tile svg { width: 20px; height: 20px; stroke-width: 1.5; color: var(--aira-slate-600); }

.icon-tile .name { font: var(--aira-t-label-sm); color: var(--aira-text-primary); }
.icon-tile .use { font: var(--aira-t-caption); color: var(--aira-text-tertiary); }

/* ───────────────────────── MISC ───────────────────────── */
.note {
  padding: var(--aira-sp-3) var(--aira-sp-4);
  background: var(--aira-state-ai-thinking-bg);
  color: var(--aira-state-ai-thinking-text);
  border-radius: var(--aira-radius-md);
  border-inline-start: 3px solid var(--aira-bg-brand);
  font: var(--aira-t-body-sm);
}
.cluster { display: flex; gap: var(--aira-sp-3); flex-wrap: wrap; align-items: center; }
.md { font: var(--aira-t-body-md); color: var(--aira-text-secondary); max-width: 760px; }
.md h2 { font: var(--aira-t-h2); color: var(--aira-text-primary); margin: var(--aira-sp-6) 0 var(--aira-sp-3); }
.md h3 { font: var(--aira-t-h3); color: var(--aira-text-primary); margin: var(--aira-sp-5) 0 var(--aira-sp-2); }
.md h4 { font: var(--aira-t-h4); color: var(--aira-text-primary); margin: var(--aira-sp-4) 0 var(--aira-sp-2); }
.md p  { margin: 0 0 var(--aira-sp-3); }
.md ul { padding-inline-start: var(--aira-sp-5); margin: 0 0 var(--aira-sp-3); }
.md li { margin-bottom: var(--aira-sp-1); color: var(--aira-text-secondary); }
.md code { font: var(--aira-t-code); background: var(--aira-code-bg-inline); padding: 2px 6px; border-radius: var(--aira-radius-xs); color: var(--aira-text-primary); }
.md a { color: var(--aira-text-link); }
.md-pre { font: var(--aira-t-code); background: var(--aira-code-bg); color: var(--aira-code-fg); border: 1px solid var(--aira-code-border); border-radius: var(--aira-radius-md); padding: var(--aira-sp-3) var(--aira-sp-4); overflow: auto; max-height: 480px; margin: 0 0 var(--aira-sp-3); }
.md-pre code { background: transparent; padding: 0; color: inherit; }

/* Per-component metadata strip (Status / Updated / Owner) */
.meta-strip {
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--aira-sp-3);
  margin: 0 0 var(--aira-sp-4);
  font: var(--aira-t-caption); color: var(--aira-text-tertiary);
}
.meta-strip .meta-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  font: var(--aira-t-label-sm);

.pv-toast { position: fixed; left: 50%; bottom: calc(var(--aira-sp-6) + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 95; max-width: calc(100% - 32px); padding: var(--aira-sp-3) var(--aira-sp-4); background: var(--aira-tooltip-bg); color: var(--aira-tooltip-text); border-radius: var(--aira-radius-md); box-shadow: var(--aira-shadow-md); font: var(--aira-t-body-sm); }


@media (max-width: 640px) {
  .pv-stage { padding-inline: var(--aira-sp-4); }

}
@media (prefers-reduced-motion: reduce) { .pv-skel i { animation: none; } }
.pv-vsep { width: 1px; height: 24px; background: var(--aira-border-default); }

.pv-other { font: var(--aira-t-label-md); color: var(--aira-text-link); padding: var(--aira-sp-2); margin-inline-start: var(--aira-sp-2); }
.pv-csv { gap: var(--aira-sp-1); padding-inline: var(--aira-sp-2); }
.pv-csv svg { width: 16px; height: 16px; }
.dv-actions { align-items: center; }
.pv-tbar-r { align-items: center; }

.pv-switch button[aria-pressed="true"] { background: var(--aira-bg-surface); color: var(--aira-text-primary); box-shadow: var(--aira-shadow-sm); }
.pv-switch button[aria-pressed="true"] b { color: var(--aira-text-link); }
.pv-switch button:hover:not([aria-pressed="true"]):not([aria-selected="true"]) { color: var(--aira-text-primary); }

.pv-switchbar { flex-wrap: wrap; gap: var(--aira-sp-3); }
</style>
</head>
<body>
<main class="pv-stage"><div class="pv-switchbar"><div class="pv-switch" role="group" aria-label="Example"><button type="button" data-sw="a1" aria-pressed="true"><b>A</b>Five charts</button><button type="button" data-sw="a2" aria-pressed="false"><b>B</b>Charts and tables</button><button type="button" data-sw="a3" aria-pressed="false"><b>C</b>One chart</button><button type="button" data-sw="a4" aria-pressed="false"><b>D</b>Still drawing, one fails</button></div><button class="iconbtn" type="button" data-replay aria-label="Play the drawing again" title="Play the drawing again" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button></div><section class="pv-frame" data-art="a1" id="web-a">

      <button class="iconbtn" type="button" data-act="wide" aria-label="Widen panel" title="Widen panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>

<script>
/* Chart engine for the preview-panel prototype. Same primitives and
   rules as the aiRA Data Visualisation page: every colour is a var(--aira-*)
   token, hover dims the other marks, numbers follow the org locale (en-IN). */
var C = (function () {
  'use strict';
  var NF = new Intl.NumberFormat('en-IN');
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function t1(x) { return (Math.round(x * 10) / 10).toFixed(1); }
  function lakh(v) { return v >= 1e7 ? t1(v / 1e7) + 'Cr' : t1(v / 1e5) + 'L'; }

  function svg(w, h, body) {
    return '<svg class="dv-svg" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true" focusable="false">' + body + '</svg>';
  }
  function txt(x, y, s, cls, anchor) {
    return '<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + (anchor ? ' text-anchor="' + anchor + '"' : '') + '>' + esc(s) + '</text>';
  }
  function line(x1, y1, x2, y2, stroke, w, dash) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + stroke + '" stroke-width="' + (w || 1) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' shape-rendering="crispEdges"/>';
  }
  function barV(x, y, w, h, fill, stroke) {
    if (h <= 0) return '';
    var r = Math.min(2, w / 2, h);
    return '<path class="mk" fill="' + fill + '"' + (stroke ? ' stroke="' + stroke + '" stroke-width="1"' : '') + ' d="M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z"/>';
  }
  function barH(x, y, w, h, fill) {
    if (w <= 0) return '';
    var r = Math.min(2, h / 2, w);
    return '<path class="mk" fill="' + fill + '" d="M' + x + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h - r) + 'Q' + (x + w) + ',' + (y + h) + ' ' + (x + w - r) + ',' + (y + h) + 'H' + x + 'Z"/>';
  }
  function hit(inner, tip, say) { return '<g class="hit" data-tip="' + esc(tip) + '" data-say="' + esc(say) + '">' + inner + '</g>'; }
  function tipHTML(head, rows, note) {
    var h = '<div class="h">' + esc(head) + '</div>';
    rows.forEach(function (r) {
      h += '<div class="r">' + (r[2] ? '<span class="dv-sw" style="background:' + r[2] + '"></span>' : '') + '<span>' + esc(r[0]) + '</span><span class="v">' + esc(r[1]) + '</span></div>';
    });
    if (note) h += '<div class="d">' + esc(note) + '</div>';
    return h;
  }

  var BASE = 'var(--aira-viz-baseline)', GRID = 'var(--aira-viz-grid)', SURF = 'var(--aira-surface-artifact-card-bg)';
  var V1 = 'var(--aira-viz-1)';
  // Loyalty tiers: locked sequential steps by rank, lowest lightest (4 tiers: seq-3..6).
  var TIER = ['var(--aira-seq-3)', 'var(--aira-seq-4)', 'var(--aira-seq-5)', 'var(--aira-seq-6)'];
  var TIERS = ['Base', 'Silver', 'Gold', 'Platinum'];
  var MON = ['Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'];
  var MONY = ['Aug 2025', 'Sep 2025', 'Oct 2025', 'Nov 2025', 'Dec 2025', 'Jan 2026', 'Feb 2026', 'Mar 2026', 'Apr 2026', 'May 2026', 'Jun 2026', 'Jul 2026'];

  function monthAxis(o, X, y, W) {
    var every = W < 520 ? 3 : W < 760 ? 2 : 1;
    MON.forEach(function (m, i) {
      if (i % every) return;
      o.push(txt(X(i), y, i === 0 ? 'Aug 2025' : m === 'Jan' ? 'Jan 2026' : m, '', 'middle'));
    });
  }

  // ── data ────────────────────────────────────────────────────
  var D = {
    outcome: [['Issued', 31.03], ['Expired', 32.53], ['Redeemed', 1.54], ['Returned', 0.30]],
    burn: [0.21, 2.28, 7.56, 23.12],
    stage: [['Active', '0–90 days', 1443688], ['Lapsing', '91–180 days', 1054520], ['Dormant', '181–365 days', 1173781], ['Churned', 'Over 365 days', 2604916]],
    active: [501240, 479830, 494610, 536020, 594870, 591330, 534950, 880410, 522760, 700180, 471920, 574300],
    revenue: [213.4, 208.1, 242.7, 321.5, 284.2, 268.9, 318.3, 533.1, 231.8, 377.6, 214.3, 262.0],
    issued: [6.81, 5.03, 2.67, 1.07, 1.02, 1.63, 5.30, 2.25, 0.90, 2.48, 0.85, 1.02],
    expired: [3.77, 8.68, 2.63, 4.28, 0.95, 0.93, 1.61, 5.32, 0.85, 1.26, 1.64, 0.61],
    redeemed: [0.32, 0.14, 0.16, 0.10, 0.09, 0.10, 0.13, 0.12, 0.09, 0.12, 0.08, 0.09],
    tierIssued: [12.83, 8.90, 5.40, 3.90],
    tierExpired: [16.90, 9.40, 4.30, 1.93],
    tierRedeemed: [0.03, 0.20, 0.41, 0.90]
  };
  var MEMBERS = D.stage.reduce(function (a, r) { return a + r[2]; }, 0);

  var F = {};

  // Horizontal bars, one series: points by outcome.
  F.outcome = function (W) {
    var rowH = 36, lab = 88, valW = 64, aw = W - lab - valW, max = 35, o = [];
    D.outcome.forEach(function (r, i) {
      var y = i * rowH + 8, w = r[1] / max * aw;
      o.push(hit('<rect class="band" x="0" y="' + (i * rowH) + '" width="' + W + '" height="' + rowH + '"/>' + txt(0, y + 14, r[0], 'l2') + barH(lab, y, w, 20, V1) + txt(lab + w + 8, y + 14, r[1].toFixed(2) + 'B', 'lp'),
        tipHTML(r[0], [['Points', r[1].toFixed(2) + 'B'], ['Against points issued', (r[1] / 31.03 * 100).toFixed(1) + '%']]), r[0] + ', ' + r[1].toFixed(2) + ' billion points'));
    });
    o.push(line(lab, 0, lab, D.outcome.length * rowH, BASE));
    return svg(W, D.outcome.length * rowH, o.join(''));
  };

  // Columns by tier, generic.
  function tierCols(W, vals, fmt, max, tipRows, tall) {
    var H = tall ? 300 : 200, T = 24, B = 28, ph = H - T - B, slot = W / 4, bw = Math.min(56, slot * 0.6), o = [];
    vals.forEach(function (v, i) {
      var h = Math.max(1, v / max * ph), x = i * slot + (slot - bw) / 2, y = T + ph - h;
      o.push(hit('<rect class="band" x="' + (i * slot) + '" y="0" width="' + slot + '" height="' + H + '"/>' + barV(x, y, bw, h, TIER[i], i === 0 ? BASE : '') +
        txt(x + bw / 2, y - 6, fmt(v), 'lp', 'middle') + txt(x + bw / 2, T + ph + 18, TIERS[i], 'l2', 'middle'),
        tipHTML(TIERS[i], tipRows(v, i)), TIERS[i] + ', ' + fmt(v)));
    });
    o.push(line(0, T + ph, W, T + ph, BASE));
    return svg(W, H, o.join(''));
  }
  F.burn = function (W, tall) {
    return tierCols(W, D.burn, function (v) { return v.toFixed(2) + '%'; }, 25, function (v, i) {
      return [['Burn rate', v.toFixed(2) + '%'], ['Redeemed', D.tierRedeemed[i].toFixed(2) + 'B'], ['Issued', D.tierIssued[i].toFixed(2) + 'B']];
    }, tall);
  };
  F.tierIssued = function (W, tall) { return tierCols(W, D.tierIssued, function (v) { return v.toFixed(2) + 'B'; }, 15, function (v) { return [['Points issued', v.toFixed(2) + 'B'], ['Share of all issued', (v / 31.03 * 100).toFixed(1) + '%']]; }, tall); };
  F.tierExpired = function (W, tall) { return tierCols(W, D.tierExpired, function (v) { return v.toFixed(2) + 'B'; }, 20, function (v, i) { return [['Points expired', v.toFixed(2) + 'B'], ['Against issued', (v / D.tierIssued[i] * 100).toFixed(0) + '%']]; }, tall); };
  F.tierRedeemed = function (W, tall) { return tierCols(W, D.tierRedeemed, function (v) { return v.toFixed(2) + 'B'; }, 1, function (v, i) { return [['Points redeemed', v.toFixed(2) + 'B'], ['Burn rate', D.burn[i].toFixed(2) + '%']]; }, tall); };

  // Horizontal bars with two-line labels: members by lifecycle stage.
  F.stage = function (W) {
    var rowH = 46, lab = 108, valW = 104, aw = W - lab - valW, max = 50, o = [];
    D.stage.forEach(function (r, i) {
      var p = r[2] / MEMBERS * 100, y = i * rowH + 10, w = p / max * aw;
      o.push(hit('<rect class="band" x="0" y="' + (i * rowH) + '" width="' + W + '" height="' + rowH + '"/>' + txt(0, y + 10, r[0], 'l2') + txt(0, y + 26, r[1]) +
        barH(lab, y + 2, w, 20, V1) + txt(lab + w + 8, y + 16, t1(p) + '% · ' + lakh(r[2]), 'lp'),
        tipHTML(r[0] + ' · ' + r[1], [['Share of members', t1(p) + '%'], ['Members', NF.format(r[2])]], 'Days since last purchase'), r[0] + ', ' + r[1] + ', ' + t1(p) + ' percent, ' + NF.format(r[2]) + ' members'));
    });
    o.push(line(lab, 0, lab, D.stage.length * rowH, BASE));
    return svg(W, D.stage.length * rowH, o.join(''));
  };

  // Shared month frame so the two activity charts line up month for month.
  function monthFrame(W, tall) {
    var H = tall ? 320 : 220, L = 64, R = 16, T = 24, B = 28;
    return { H: H, L: L, R: R, T: T, B: B, pw: W - L - R, ph: H - T - B };
  }
  F.active = function (W, tall) {
    var f = monthFrame(W, tall), max = 1000000, o = [], slot = f.pw / 12, bw = Math.min(28, slot * 0.6);
    function Y(v) { return f.T + f.ph - v / max * f.ph; }
    function X(i) { return f.L + (i + 0.5) * slot; }
    [0, 250000, 500000, 750000, 1000000].forEach(function (t) { o.push(line(f.L, Y(t), W - f.R, Y(t), t ? GRID : BASE) + txt(f.L - 8, Y(t) + 4, t ? lakh(t).replace('.0L', 'L') : '0', '', 'end')); });
    monthAxis(o, X, f.H - 6, W);
    var peak = D.active.indexOf(Math.max.apply(null, D.active));
    D.active.forEach(function (v, i) {
      var y = Y(v);
      o.push(hit('<rect class="band" x="' + (f.L + i * slot) + '" y="' + f.T + '" width="' + slot + '" height="' + f.ph + '"/>' + barV(X(i) - bw / 2, y, bw, f.T + f.ph - y, V1) + (i === peak ? txt(X(i), y - 6, lakh(v), 'lp', 'middle') : ''),
        tipHTML(MONY[i], [['Active customers', NF.format(v)]]), MONY[i] + ', ' + NF.format(v) + ' active customers'));
    });
    return svg(W, f.H, o.join(''));
  };
  F.revenue = function (W, tall) {
    var f = monthFrame(W, tall), max = 600, o = [], slot = f.pw / 12;
    function Y(v) { return f.T + f.ph - v / max * f.ph; }
    function X(i) { return f.L + (i + 0.5) * slot; }
    [0, 150, 300, 450, 600].forEach(function (t) { o.push(line(f.L, Y(t), W - f.R, Y(t), t ? GRID : BASE) + txt(f.L - 8, Y(t) + 4, t ? '₹' + t + ' Cr' : '0', '', 'end')); });
    monthAxis(o, X, f.H - 6, W);
    o.push('<polyline class="mk" fill="none" stroke="' + V1 + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' + D.revenue.map(function (v, i) { return X(i) + ',' + Y(v); }).join(' ') + '"/>');
    var peak = D.revenue.indexOf(Math.max.apply(null, D.revenue));
    D.revenue.forEach(function (v, i) {
      o.push(hit('<rect class="band" x="' + (f.L + i * slot) + '" y="' + f.T + '" width="' + slot + '" height="' + f.ph + '"/><line class="xh" x1="' + X(i) + '" y1="' + f.T + '" x2="' + X(i) + '" y2="' + (f.T + f.ph) + '" stroke-width="1"/><circle class="mk" cx="' + X(i) + '" cy="' + Y(v) + '" r="3" fill="' + V1 + '" stroke="' + SURF + '" stroke-width="1"/>' + (i === peak ? txt(X(i), Y(v) - 10, '₹' + v.toFixed(1) + ' Cr', 'lp', 'middle') : ''),
        tipHTML(MONY[i], [['Revenue', '₹' + v.toFixed(1) + ' Cr']]), MONY[i] + ', revenue ' + v.toFixed(1) + ' crore rupees'));
    });
    return svg(W, f.H, o.join(''));
  };

  // Three lines with names at the line ends (no separate key needed).
  F.flows = function (W, tall) {
    var H = tall ? 340 : 240, L = 44, R = 84, T = 12, B = 28, pw = W - L - R, ph = H - T - B, max = 10, o = [];
    function X(i) { return L + i * pw / 11; }
    function Y(v) { return T + ph - v / max * ph; }
    [0, 2.5, 5, 7.5, 10].forEach(function (t) { o.push(line(L, Y(t), W - R, Y(t), t ? GRID : BASE) + txt(L - 8, Y(t) + 4, t ? t + 'B' : '0', '', 'end')); });
    monthAxis(o, X, H - 6, W - R + 40);
    var S = [['Issued', 'issued', 'var(--aira-viz-1)'], ['Expired', 'expired', 'var(--aira-viz-2)'], ['Redeemed', 'redeemed', 'var(--aira-viz-3)']];
    var ends = S.map(function (s) { return Y(D[s[1]][11]); });
    var order = [0, 1, 2].sort(function (a, b) { return ends[a] - ends[b]; });
    for (var k = 1; k < 3; k++) if (ends[order[k]] - ends[order[k - 1]] < 15) ends[order[k]] = ends[order[k - 1]] + 15;
    S.forEach(function (s, si) {
      o.push('<polyline class="mk" fill="none" stroke="' + s[2] + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' + D[s[1]].map(function (v, i) { return X(i) + ',' + Y(v); }).join(' ') + '"/>');
      o.push('<circle cx="' + X(11) + '" cy="' + Y(D[s[1]][11]) + '" r="3" fill="' + s[2] + '" stroke="' + SURF + '" stroke-width="1"/>' + txt(X(11) + 10, ends[si] + 4, s[0], 'lm'));
    });
    MON.forEach(function (m, i) {
      var cw = pw / 11;
      o.push(hit('<rect class="band" x="' + (X(i) - cw / 2) + '" y="' + T + '" width="' + cw + '" height="' + ph + '"/><line class="xh" x1="' + X(i) + '" y1="' + T + '" x2="' + X(i) + '" y2="' + (T + ph) + '" stroke-width="1"/>',
        tipHTML(MONY[i], S.map(function (s) { return [s[0], D[s[1]][i].toFixed(2) + 'B', s[2]]; })),
        MONY[i] + '. ' + S.map(function (s) { return s[0] + ' ' + D[s[1]][i].toFixed(2) + ' billion'; }).join(', ')));
    });
    return svg(W, H, o.join(''));
